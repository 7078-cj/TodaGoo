name: EAS Build (Android APK)

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/eas-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      APP_NAME: TodaGoo
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_WS_URL: ${{ secrets.EXPO_PUBLIC_WS_URL }}
          EXPO_PUBLIC_ORS_API_KEY: ${{ secrets.EXPO_PUBLIC_ORS_API_KEY }}
        run: |
          missing=0
          for name in EXPO_TOKEN EXPO_PUBLIC_API_URL EXPO_PUBLIC_WS_URL EXPO_PUBLIC_ORS_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing or empty secret: $name"
              missing=1
            else
              echo "OK: $name is set"
            fi
          done
          if [ "$missing" -eq 1 ]; then
            exit 1
          fi

          case "$EXPO_PUBLIC_API_URL" in
            https://*/api/) echo "OK: EXPO_PUBLIC_API_URL format" ;;
            *) echo "::error::EXPO_PUBLIC_API_URL must be https and end with /api/"; exit 1 ;;
          esac
          case "$EXPO_PUBLIC_WS_URL" in
            wss://*) echo "OK: EXPO_PUBLIC_WS_URL format" ;;
            *) echo "::error::EXPO_PUBLIC_WS_URL must start with wss://"; exit 1 ;;
          esac

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          expo-cache: false
          eas-cache: false
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Sync env vars to EAS production environment
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_WS_URL: ${{ secrets.EXPO_PUBLIC_WS_URL }}
          EXPO_PUBLIC_ORS_API_KEY: ${{ secrets.EXPO_PUBLIC_ORS_API_KEY }}
        run: |
          for name in EXPO_PUBLIC_API_URL EXPO_PUBLIC_WS_URL EXPO_PUBLIC_ORS_API_KEY; do
            eas env:create --environment production \
              --name "$name" \
              --value "${!name}" \
              --visibility plaintext \
              --scope project \
              --force \
              --non-interactive
          done

      - name: Build Android APK on EAS
        env:
          APP_VARIANT: production
          EAS_BUILD_NO_EXPO_GO_WARNING: "true"
        run: |
          echo "APP_VARIANT=$APP_VARIANT"
          eas build --platform android --profile production --non-interactive --json > build.json

          status=$(jq -r '.[0].status' build.json)
          if [ "$status" != "FINISHED" ]; then
            echo "::error::EAS build ended with status: $status"
            jq -r '.[0] | {id, status, error}' build.json
            exit 1
          fi

          version=$(jq -r '.[0].appVersion' build.json)
          code=$(jq -r '.[0].appBuildVersion' build.json)
          url=$(jq -r '.[0].artifacts.buildUrl' build.json)
          apk="${APP_NAME}-v${version}-${code}.apk"

          echo "Downloading $apk"
          curl -fL "$url" -o "$apk"

          echo "APK_FILE=$apk" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_FILE }}
          path: mobile/${{ env.APK_FILE }}
          if-no-files-found: error
          retention-days: 30