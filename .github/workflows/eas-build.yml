name: EAS Build

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/eas-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_WS_URL: ${{ secrets.EXPO_PUBLIC_WS_URL }}
          EXPO_PUBLIC_ORS_API_KEY: ${{ secrets.EXPO_PUBLIC_ORS_API_KEY }}
        run: |
          missing=0
          for name in EXPO_TOKEN EXPO_PUBLIC_API_URL EXPO_PUBLIC_WS_URL EXPO_PUBLIC_ORS_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing or empty secret: $name"
              missing=1
            else
              echo "OK: $name is set"
            fi
          done
          if [ "$missing" -eq 1 ]; then
            exit 1
          fi

          # Format checks (no values printed)
          case "$EXPO_PUBLIC_API_URL" in
            https://*/api/) echo "OK: EXPO_PUBLIC_API_URL format" ;;
            *) echo "::error::EXPO_PUBLIC_API_URL must be https and end with /api/"; exit 1 ;;
          esac
          case "$EXPO_PUBLIC_WS_URL" in
            wss://*) echo "OK: EXPO_PUBLIC_WS_URL format" ;;
            *) echo "::error::EXPO_PUBLIC_WS_URL must start with wss://"; exit 1 ;;
          esac

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          expo-cache: false
          eas-cache: false
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Create .env.production
        run: |
          {
            echo "EXPO_PUBLIC_API_URL=${{ secrets.EXPO_PUBLIC_API_URL }}"
            echo "EXPO_PUBLIC_WS_URL=${{ secrets.EXPO_PUBLIC_WS_URL }}"
            echo "EXPO_PUBLIC_ORS_API_KEY=${{ secrets.EXPO_PUBLIC_ORS_API_KEY }}"
          } > .env.production

      - name: Verify .env.production contents
        run: |
          for key in EXPO_PUBLIC_API_URL EXPO_PUBLIC_WS_URL EXPO_PUBLIC_ORS_API_KEY; do
            if grep -Eq "^${key}=.+" .env.production; then
              echo "OK: $key present in .env.production"
            else
              echo "::error::$key missing or empty in .env.production"
              exit 1
            fi
          done

      - name: Build on EAS
        env:
          APP_VARIANT: production
        run: |
          echo "APP_VARIANT=$APP_VARIANT"
          eas build --platform all --profile production --non-interactive --no-wait