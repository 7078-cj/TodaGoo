# Backend tests.
#   Pull requests          always the full suite (it's the check that guards merging)
#   Push to main (merges)  always the full suite
#   Push to other branches only when something under backend/ (or this file) changed; skipped otherwise
#   Manual run             full suite (Actions → Backend tests → Run workflow)
#
# To block merging until it passes: GitHub → Settings → Branches (or Rulesets) → protect `main`
# → "Require status checks to pass" → add "Backend tests".
#
# Each run's summary page shows how many passed and, for every failed test, what caused it, the calls
# it made and the full traceback (api/test/ci_summary.py); failures are also marked on the test lines.
# The "test-log" artifact has the Excel test log (backend/test_log/*.xlsx) and console.log.
name: Backend tests

on:
  pull_request:
  push:
  workflow_dispatch:

# a new push to the same PR cancels the run still going for the old commit
concurrency:
  group: backend-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # decides whether the tests run (see the table at the top)
  changes:
    name: Check for backend changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" != "push" ] || [ "$REF" = "refs/heads/main" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Full suite: $EVENT on $REF" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # a new branch has no "before" commit: compare with where it left main
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            BEFORE=$(git merge-base origin/main "$SHA" 2>/dev/null || echo "")
          fi
          if [ -z "$BEFORE" ]; then
            CHANGED=$(git ls-files)  # nothing to compare with: treat everything as changed
          else
            CHANGED=$(git diff --name-only "$BEFORE" "$SHA")
          fi
          BACKEND=$(echo "$CHANGED" | grep -E '^(backend/|\.github/workflows/backend-tests\.yml$)' || true)
          if [ -n "$BACKEND" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            { echo "Backend changed, running tests:"; echo '```'; echo "$BACKEND" | head -50; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No backend changes in this push: tests skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

  test:
    name: Backend tests
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: todagoo
          POSTGRES_USER: todagoo
          POSTGRES_PASSWORD: todagoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U todagoo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        working-directory: backend

    # CI-only values (no real secrets needed). Same mode as local development:
    # DEBUG=True keeps the HTTPS redirect off, so the test client isn't sent 301s.
    env:
      SECRET_KEY: ci-only-not-a-secret
      DEBUG: "True"
      ENVIRONMENT: development
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      EMAIL_HOST_USER: ci@example.com
      EMAIL_HOST_PASSWORD: ci
      PG_NAME: todagoo
      PG_USER: todagoo
      PG_PASSWORD: todagoo
      PG_HOST: localhost
      PG_PORT: "5432"
      # no REDIS_HOST: channels / cache / celery use their in-memory test setup (see settings.py)
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install GDAL / GEOS / PROJ (GeoDjango) and libpq (psycopg)
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdal-bin libgdal-dev libgeos-dev libproj-dev libpq-dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        # the console output is also saved as test_log/console.log (uploaded below)
        run: |
          mkdir -p test_log
          set -o pipefail
          python manage.py test --noinput 2>&1 | tee test_log/console.log

      # passed / failed counts, what failed, why, and the log -> run summary + annotations
      - name: Test summary
        if: always()
        run: python api/test/ci_summary.py test_log

      - name: Upload test log (Excel + console.log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: |
            backend/test_log/*.xlsx
            backend/test_log/console.log
          if-no-files-found: warn
          retention-days: 30
